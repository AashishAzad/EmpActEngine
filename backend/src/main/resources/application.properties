# =====================================================================
# APPLICATION
# =====================================================================
spring.application.name=empact-backend
server.port=8080
server.servlet.context-path=/api/v1

# =====================================================================
# DATABASE — Jmix datasource (uses 'main.datasource' prefix)
# =====================================================================
main.datasource.url=jdbc:postgresql://localhost:5432/empact_db
main.datasource.username=postgres
main.datasource.password=Aashish909
main.datasource.driver-class-name=org.postgresql.Driver
main.datasource.hikari.maximum-pool-size=10
main.datasource.hikari.minimum-idle=2

# =====================================================================
# DATABASE — Spring Data JPA / Hibernate datasource
# Must point to SAME database as Jmix — one DB, two JPA contexts
# =====================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/empact_db
spring.datasource.username=postgres
spring.datasource.password=Aashish909
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# HIBERNATE JPA (for our business entities)
# =====================================================================
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.archive.autodetection=class

# EclipseLink DDL — auto-create all tables on startup
eclipselink.ddl-generation=create-or-extend-tables
eclipselink.ddl-generation.output-mode=database

# =====================================================================
# JMIX — disable conflicting features
# =====================================================================
jmix.liquibase.enabled=false
spring.liquibase.enabled=false
main.liquibase.enabled=false
jmix.security.oauth2.enabled=false
jmix.core.available-locales=en

jmix.data.dbms-type=postgresql
jmix.data.dbms-version=

# =====================================================================
# JWT
# =====================================================================
app.jwt.secret=EmpAct909TechSecretKeyForJWTTokenGenerationEmployeeActivitySystem2026
app.jwt.expiration-ms=604800000
app.jwt.refresh-expiration-ms=2592000000

# =====================================================================
# CORS
# =====================================================================
app.cors.allowed-origins=*

# =====================================================================
# FILE UPLOAD
# =====================================================================
app.upload.dir=./uploads/letters
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================================
# SCHEDULING
# =====================================================================
spring.task.scheduling.pool.size=5

# =====================================================================
# LOGGING
# =====================================================================
logging.level.root=INFO
logging.level.com.tech909.empact=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.eclipselink.logging.sql=info
logging.level.io.jmix.core.datastore=info
logging.level.io.jmix.core.AccessLogger=info
logging.level.io.jmix=info